<!-- Lista de servidores con botón visual para crear uno nuevo -->
<div class="server-list">
  <button
    type="button"
    class="create-server-btn"
    (click)="onCreate()"
    aria-label="Añadir un servidor"
    title="Añadir un servidor"
  >
    <span class="create-server-icon">+</span>
  </button>

  <ul class="server-items">
    <li *ngFor="let s of servers" class="server-item" (click)="onSelect(s.id)">
      <div class="server-card">
        <img *ngIf="s.iconUrl" [src]="s.iconUrl" [alt]="s.name" width="28" height="28">
        <span *ngIf="!s.iconUrl" class="server-fallback">{{ s.name.slice(0, 1) }}</span>
      </div>

      <button type="button" class="delete-btn" (click)="onDelete(s.id, $event)">Eliminar</button>
    </li>
  </ul>
</div>

<style>
.server-list {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.create-server-btn {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 9999px;
  background: #5d5cff;
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 24px rgba(93, 92, 255, 0.35);
  cursor: pointer;
  position: relative;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
}

.create-server-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 28px rgba(93, 92, 255, 0.42);
  filter: brightness(1.05);
}

.create-server-btn::after {
  content: 'Añadir un servidor';
  position: absolute;
  left: calc(100% + 12px);
  top: 50%;
  transform: translateY(-50%) scale(0.96);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  background: rgba(27, 27, 27, 0.96);
  color: #fff;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.create-server-btn:hover::after {
  opacity: 1;
  transform: translateY(-50%) scale(1);
}

.create-server-icon {
  font-size: 28px;
  line-height: 1;
  font-weight: 300;
  margin-top: -2px;
}

.server-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  padding: 0;
  margin: 0;
  list-style: none;
}

.server-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}

.server-card {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.server-fallback {
  font-weight: 700;
  font-size: 16px;
}

.delete-btn {
  display: none;
}
</style>
