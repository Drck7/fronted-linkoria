<!-- Barra de servidores usando el componente presentacional server-list -->
<aside class="w-18 bg-base-300 flex flex-col items-center py-3 gap-2 border-r border-black/10 h-full">
  <server-list
    [servers]="serversService.servers()"
    (selectServer)="onSelectServer($event)"
    (deleteServer)="onDeleteServer($event)"
    (createRequest)="onCreateRequest()"
  ></server-list>
</aside>
