<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
      </div>
      <ul
        tabindex="-1"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
        <li><a>Item 1</a></li>
        <li>
          <a>Parent</a>
          <ul class="p-2">
            <li><a>Submenu 1</a></li>
            <li><a>Submenu 2</a></li>
          </ul>
        </li>
        <li><a>Item 3</a></li>
      </ul>
    </div>
    <a class="btn btn-ghost text-xl"
      routerLink="/"
      routerLinkActive="text-secondary">
      Linkoria
    </a>
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      <li>
        <a routerLink="/users/all" class="btn btn-ghost" routerLinkActive="text-secondary">
            Todos
        </a>
      </li>
      <li>
        <a routerLink="/users/online" class="btn btn-ghost" routerLinkActive="text-secondary">
            Online
        </a>
      </li>
      <li>
        <a routerLink="/users/search" class="btn btn-ghost" routerLinkActive="text-secondary">
            Añadir amigo
        </a>
      </li>
      <li>
        <a routerLink="/users/notify" class="btn btn-ghost" routerLinkActive="text-secondary">
            Notificaciones
        </a>
      </li>
    </ul>
  </div>
  <!-- Datos y boton de login del usuario -->
  <div class="navbar-end gap-4">
    @if(authService.authStatus() === 'authenticated') {
      <button class="btn btn-ghost"  routerLink="/profile" routerLinkActive="text-secondary"  >
        {{ authService.user()?.username }}
      </button>
      <button class="btn btn-sm btn-error" (click)="authService.clearSession()">
        Salir
      </button>
    }
      @else if(authService.authStatus() === 'not-authenticated') {
        <a class="btn btn-primary" routerLink="/auth/login" routerLinkActive="text-secondary">
          Iniciar sesión
        </a>
      }
      @else {
        <a class="btn btn-ghost">...</a>
      }

  </div>



</div>
